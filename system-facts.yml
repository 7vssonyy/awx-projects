---
- name: Collect Ubuntu System Information
  hosts: all
  gather_facts: true

  tasks:

    - name: Display hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_hostname }}"

    - name: Display operating system
      ansible.builtin.debug:
        msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Display kernel version
      ansible.builtin.debug:
        msg: "Kernel: {{ ansible_kernel }}"

    - name: Display processor information
      ansible.builtin.debug:
        msg: "CPU Cores: {{ ansible_processor_vcpus }}"

    - name: Display memory information
      ansible.builtin.debug:
        msg: "Total Memory: {{ ansible_memtotal_mb }} MB"

    - name: Display IP addresses
      ansible.builtin.debug:
        msg: "IP Addresses: {{ ansible_all_ipv4_addresses }}"
